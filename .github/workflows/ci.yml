name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Node ${{ matrix.node }} / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零运行时依赖，因此不需要 npm install
      - name: 自检（语法 + 项目约定）
        run: node tools/lint.mjs

      # 不给路径：Node 的默认发现机制在 20/22/24 上都可用；
      # 显式写 `test/` 在 Node 22/24 上会被当成文件路径而报 Cannot find module
      #
      # 超时 60 秒（而不是 30）：test/docker-scripts.test.mjs 会真的起 PowerShell 与 git
      # 来验证部署/升级脚本，Windows 上整个文件需要 30 秒以上。
      - name: 单元测试
        run: node --test --test-timeout=60000

  # 真实构建并运行镜像。开发机上没有 Docker，所以镜像的正确性（非 root、目录属主、
  # 能否启动并通过健康检查）只能在这里验证——写完 Dockerfile 不算完成。
  docker-verify:
    name: 镜像验证（真实构建与运行）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 配置与变量插值
        run: docker compose config

      # 记录基础镜像里已有的用户：官方 node 镜像自带 node:1000，
      # 而 Linux 宿主 id -u 通常正好是 1000 —— 这正是构建失败的原因
      - name: 基础镜像里的用户（确认 UID 冲突）
        run: |
          docker run --rm node:22-alpine sh -c 'echo "--- passwd ---"; tail -n 3 /etc/passwd; echo "--- group ---"; tail -n 3 /etc/group'

      - name: 构建镜像（默认 UID）
        run: docker build --progress=plain -t torrent-search:verify .

      # 宿主 UID=1000 时与基础镜像自带的 node 用户冲突：
      # 早期 Dockerfile 直接 adduser -u 1000 会在这里构建失败
      - name: 构建镜像（宿主 UID=1000，冲突场景）
        run: docker build --progress=plain --build-arg UID=1000 --build-arg GID=1000 -t torrent-search:verify-hostuid .

      - name: 以宿主 UID 运行时仍能写下载目录
        run: |
          uid=$(docker run --rm torrent-search:verify-hostuid id -u)
          echo "容器内 UID = $uid"
          test "$uid" = "1000" || { echo "应以传入的 UID 运行"; exit 1; }
          docker run --rm torrent-search:verify-hostuid sh -c 'touch /downloads/.w && rm /downloads/.w'
          docker run --rm -v ts-verify-hostuid:/downloads torrent-search:verify-hostuid sh -c 'touch /downloads/.w && rm /downloads/.w'

      - name: 容器以非 root 用户运行
        run: |
          uid=$(docker run --rm torrent-search:verify id -u)
          echo "容器内 UID = $uid"
          test "$uid" != "0" || { echo "不该以 root 运行"; exit 1; }

      - name: 下载目录与缓存目录可写
        run: |
          docker run --rm torrent-search:verify sh -c 'touch /downloads/.w && rm /downloads/.w'
          docker run --rm torrent-search:verify sh -c 'touch "$TORRENT_SEARCH_CACHE/.w" 2>/dev/null || mkdir -p "$TORRENT_SEARCH_CACHE" && touch "$TORRENT_SEARCH_CACHE/.w"'

      - name: 命名卷场景下仍可写（属主随镜像对齐）
        run: docker run --rm -v ts-verify-data:/downloads torrent-search:verify sh -c 'touch /downloads/.w && rm /downloads/.w'

      - name: 启动容器并通过健康检查
        run: |
          docker run -d --name ts-verify -p 18787:8787 torrent-search:verify
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          echo "--- 容器日志 ---"
          docker logs ts-verify
          test -n "$ok" || { echo "健康检查未通过"; exit 1; }
          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:18787/api/health
          docker rm -f ts-verify

      - name: 容器内诊断（doctor 在容器里应说明看不到宿主机网络）
        run: docker run --rm torrent-search:verify node bin/magnet-search.mjs doctor || true

  smoke:
    name: 实网冒烟（非阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 公开站点随时可能被墙/改版，这一项失败只作为提示，不阻塞合并
      - name: 实网冒烟
        run: node tools/smoke.mjs ubuntu
