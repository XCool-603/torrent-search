name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Node ${{ matrix.node }} / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零运行时依赖，因此不需要 npm install
      - name: 自检（语法 + 项目约定）
        run: node tools/lint.mjs

      # 不给路径：Node 的默认发现机制在 20/22/24 上都可用；
      # 显式写 `test/` 在 Node 22/24 上会被当成文件路径而报 Cannot find module
      #
      # 超时 60 秒（而不是 30）：test/docker-scripts.test.mjs 会真的起 PowerShell 与 git
      # 来验证部署/升级脚本，Windows 上整个文件需要 30 秒以上。
      - name: 单元测试
        run: node --test --test-timeout=60000

  smoke:
    name: 实网冒烟（非阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 公开站点随时可能被墙/改版，这一项失败只作为提示，不阻塞合并
      - name: 实网冒烟
        run: node tools/smoke.mjs ubuntu
